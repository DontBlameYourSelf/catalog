            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 60px 20px;
            margin-bottom: 50px;
            background: linear-gradient(135deg, rgba(20, 20, 30, 0.9) 0%, rgba(10, 10, 20, 0.9) 100%);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 3.5em;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf, #00d4ff);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientFlow 3s ease infinite;
        }

        @keyframes gradientFlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .subtitle {
            font-size: 1.2em;
            color: #888;
            letter-spacing: 1px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 15px 40px;
            background: rgba(30, 30, 40, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #e0e0e0;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .tab-btn:hover {
            background: rgba(50, 50, 60, 0.9);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #00d4ff 0%, #7b2cbf 100%);
            border-color: transparent;
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3);
        }

        .search-box {
            max-width: 600px;
            margin: 0 auto 40px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 18px 25px;
            background: rgba(30, 30, 40, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #e0e0e0;
            font-size: 1.05em;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .tool-card {
            background: linear-gradient(135deg, rgba(30, 30, 40, 0.9) 0%, rgba(20, 20, 30, 0.9) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .tool-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.05), transparent);
            transition: left 0.5s ease;
        }

        .tool-card:hover::before {
            left: 100%;
        }

        .tool-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 212, 255, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .tool-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .tool-icon {
            width: 50px;
            height: 50px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
        }

        .tool-name {
            font-size: 1.3em;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .tool-description {
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 15px;
            font-size: 0.95em;
        }

        .tool-link {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: #00d4ff;
            text-decoration: none;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .tool-link:hover {
            background: rgba(0, 212, 255, 0.2);
            transform: translateX(5px);
        }

        .category-badge {
            display: inline-block;
            padding: 5px 12px;
            background: rgba(123, 44, 191, 0.2);
            border: 1px solid rgba(123, 44, 191, 0.4);
            border-radius: 6px;
            font-size: 0.8em;
            color: #b794f6;
            margin-top: 10px;
        }

        .footer {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            font-size: 0.95em;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 50px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5em;
            }

            .tools-grid {
                grid-template-columns: 1fr;
            }

            .tabs {
                flex-direction: column;
            }
        }
    </style>
</head>

        function createToolCard(tool) {
            return `
                <div class="tool-card" data-name="${tool.name.toLowerCase()}" data-desc="${tool.desc.toLowerCase()}" data-category="${tool.category.toLowerCase()}">
                    <div class="tool-header">
                        <div class="tool-icon">${tool.icon}</div>
                        <div class="tool-name">${tool.name}</div>
                    </div>
                    <div class="tool-description">${tool.desc}</div>
                    <a href="${tool.url}" class="tool-link" target="_blank">Visit Site →</a>
                    <span class="category-badge">${tool.category}</span>
                </div>
            `;
        }

        function populateGrid(tools, gridId) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = tools.map(tool => createToolCard(tool)).join('');
        }

                btn.classList.remove('active');
            });
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // Initialize grids
        populateGrid(osintTools, 'osintGrid');
        populateGrid(pentestTools, 'pentestGrid');
        populateGrid(ctfPlatforms, 'ctfGrid');

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const activeTab = document.querySelector('.tab-content.active');
            const cards = activeTab.querySelectorAll('.tool-card');
            
            cards.forEach(card => {
                const name = card.dataset.name;
                const desc = card.dataset.desc;
                const category = card.dataset.category;
                
                if (name.includes(searchTerm) || desc.includes(searchTerm) || category.includes(searchTerm)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
